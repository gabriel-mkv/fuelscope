name: Update ANP Data

on:
  schedule:
    # Terça-feira, às 10h de Brasília (13h UTC).
    - cron: "0 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Package backend
        run: ./mvnw package -DskipTests -DskipITs -B

      - name: Update prices from ANP
        run: java -jar target/quarkus-app/quarkus-run.jar

      - name: Commit updated JSON data
        shell: bash
        run: |
          set -euo pipefail

          git add data/fuel-history.json data/fuel-prices.json

          if git diff --cached --quiet; then
            echo "Os dados não mudaram; nenhum commit necessário."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(data): update ANP fuel prices"
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build website
        working-directory: web
        run: npm run build

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
